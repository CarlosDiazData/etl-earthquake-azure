# openspec/config.yaml
schema: spec-driven

context: |
  Proyecto: migración etl-earthquake-aws → Azure.
  Stack: Terraform (AzureRM + Databricks), ADLS Gen2 (bronze/silver/gold),
    Databricks (PySpark/Dal), ADF (orquestación), GitHub Actions (CI/CD).
  Arquitectura: medallión (bronze raw → silver cleansed Delta → gold dimensional Parquet).
  Testing: no hay runner, frameworks ni config de testing detectados.
  Strict TDD: false (no disponible por ausencia de test runner).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "terraform validate"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
